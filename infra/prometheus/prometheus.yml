global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI app (src/jobmatch/observability/metrics.py)
  - job_name: jobmatch-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # llama.cpp llama-server on the host (started with --metrics), exposes llamacpp:* metrics
  - job_name: llama-server
    metrics_path: /metrics
    static_configs:
      - targets: ["172.17.0.1:8080"]
