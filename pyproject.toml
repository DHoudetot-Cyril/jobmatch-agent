[project]
name = "jobmatch-agent"
version = "0.1.0"
description = "Hierarchical LangGraph agents that match a CV to a job offer, with Langfuse tracing, Prometheus/Grafana monitoring and DeepEval evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.19",
    "langchain-core>=1.7.4",
    "langchain-openai>=1.7.3",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary]>=3.3.8",
    "psycopg-pool>=3.3.3",
    "langfuse>=5.1.0",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.16.2",
    "prometheus-client>=0.26.0",
    "httpx>=0.28.1",
    "pypdf>=5.0.0",
    "pypdfium2>=4.30.0",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.17.3",
]
eval = [
    "deepeval>=4.3.3",
]
# Local "System 1" decision models (bench/decisions). CPU-only torch, never in the API image
# (the Dockerfile syncs with --no-dev and no extra group).
decisions = [
    "laya==0.4.22",
    "torch>=2.4",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobmatch"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["llm: needs a running llama-server (skipped in CI)"]
